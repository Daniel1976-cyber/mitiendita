<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Punto de Venta</title>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>

  <!-- LOGIN -->
  <div id="login" class="view active">
    <header><img id="logoLogin" src="" alt="logo" /><div class="store-name" id="nombreLogin"></div></header>
    <div class="panel" style="max-width:360px; margin:2rem auto;">
      <h3>Acceso</h3>
      <div class="pw-wrap">
        <input id="password" type="password" placeholder="Contraseña"
               autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false"
               onkeydown="if(event.key==='Enter') login()" />
        <button type="button" id="pwToggle" class="pw-toggle" aria-label="Mostrar contraseña" aria-pressed="false"
                onmousedown="event.preventDefault()" onclick="togglePassword()">
          <svg class="ico-ojo" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg class="ico-ojo-tachado" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
        </button>
      </div>
      <button class="primario" onclick="login()">Entrar</button>
      <p id="loginError" class="msg error"></p>
      <p style="font-size:.8rem; color:#94a3b8;">Necesitas conexión la primera vez del día para entrar. Después, la app sigue funcionando aunque se caiga el wifi.</p>
    </div>
  </div>

  <!-- NAV -->
  <header id="topNav" style="display:none;">
    <img id="logoNav" src="" alt="logo" />
    <div class="store-name" id="nombreNav"></div>
    <span class="spacer"></span>
    <span class="sync-badge" id="syncBadge">Al día</span>
    <button class="nav-btn" onclick="mostrarHome()">🏠</button>
  </header>

  <!-- HOME -->
  <div id="home" class="view">
    <div class="panel">
      <button class="primario" onclick="nuevaFactura()">➕ Nueva factura</button>
      <button class="secundario" onclick="abrirCuadre()">📋 Cuadre del día</button>
    </div>
    <h3 style="padding:0 .25rem;">Ventas de hoy</h3>
    <div id="facturasHoy"></div>
    <!-- Al final a propósito: lejos de los botones que se tocan todo el día,
         para no cerrar la sesión por error. -->
    <div class="panel" style="margin-top:1.5rem;">
      <button class="secundario" onclick="cerrarSesion()">🚪 Cerrar sesión</button>
    </div>
  </div>

  <!-- NUEVA FACTURA -->
  <div id="vistaFactura" class="view">
    <div class="panel">
      <h3 id="tituloFactura">Nueva factura</h3>
      <input id="vendedorInput" type="text" placeholder="Vendedor (tu nombre)" />
      <div id="lineasContenedor"></div>
      <button class="secundario" onclick="agregarLinea()">➕ Agregar producto</button>
      <div class="total-row"><span>Total</span><span id="totalFactura">0.00</span></div>
      <button class="primario" onclick="guardarFactura()">Guardar factura</button>
      <button class="secundario" onclick="mostrarHome()">Cancelar</button>
      <p id="facturaMsg" class="msg"></p>
    </div>
  </div>

  <!-- CUADRE DEL DÍA -->
  <div id="vistaCuadre" class="view">
    <div class="panel">
      <h3>Cuadre del día</h3>
      <input id="fechaCuadre" type="date" onchange="cargarCuadre()" />
      <div style="overflow-x:auto;">
        <table class="cuadre-tabla">
          <thead>
            <tr>
              <th>Producto</th><th>Inicial</th><th>Entrada</th><th>Merma</th>
              <th>Vendida</th><th>Final</th><th>Importe</th>
            </tr>
          </thead>
          <tbody id="cuadreTbody"></tbody>
        </table>
      </div>
      <div class="total-row"><span>Importe total del día</span><span id="cuadreTotal">0.00</span></div>
      <button class="primario" onclick="guardarCuadre()">Guardar cuadre del día</button>
      <button class="secundario" onclick="mostrarHome()">Volver</button>
      <p id="cuadreMsg" class="msg"></p>
    </div>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
